<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promoter Training Schedule Dashboard</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#2563eb', secondary: '#64748b' },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- React, ReactDOM, Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- SheetJS & Html2Canvas -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- Firebase SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #334155; margin: 0; padding: 0; overflow-x: hidden; }
        .fade-in { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef, useCallback } = React;

        const MONTHS = [
            'January', 'February', 'March', 'April', 'May', 'June',
            'July', 'August', 'September', 'October', 'November', 'December'
        ];
        const YEARS = ['2024', '2025', '2026', '2027', '2028', '2029', '2030'];

        const firebaseConfig = {
            apiKey: "AIzaSyCAxKcfY-OmCBG_y59q7bOzh6XUz1FFiWI",
            authDomain: "sltt-od-tool.firebaseapp.com",
            projectId: "sltt-od-tool",
            storageBucket: "sltt-od-tool.firebasestorage.app",
            messagingSenderId: "1003205441104",
            appId: "1:1003205441104:web:10faebd4c50691ae534355",
            measurementId: "G-HPRFZEW34J"
        };

        let firestoreDb = null;
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            firestoreDb = firebase.firestore();
        } catch (err) {
            console.error("Firebase init error:", err);
        }

        // Icons
        const IconUpload = () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4 mr-1.5 flex-shrink-0"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>;
        const IconAlert = ({className="w-4 h-4 mr-1.5 flex-shrink-0"}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>;
        const IconSettings = () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5 text-slate-500 mr-2 flex-shrink-0"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l-.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>;
        const IconShuffle = () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4 mr-1.5 flex-shrink-0"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>;
        const IconSaveFile = () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4 mr-1.5 flex-shrink-0"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>;
        const IconFolderOpen = () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4 mr-1.5 flex-shrink-0"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>;
        const IconClose = () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5 flex-shrink-0"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;
        const IconEdit = () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-3.5 h-3.5 flex-shrink-0"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>;
        const IconCalendar = () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4 mr-1.5 flex-shrink-0"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>;
        const IconTrash = () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-3.5 h-3.5 text-red-500 hover:text-red-700 flex-shrink-0"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>;
        const IconCloud = () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4 mr-1.5 flex-shrink-0"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path></svg>;

        const App = () => {
            const [step, setStep] = useState('upload'); 
            const [fileName, setFileName] = useState('');
            const [error, setError] = useState('');
            
            const [rawData, setRawData] = useState([]);
            const [headers, setHeaders] = useState([]);
            
            const [mappings, setMappings] = useState({
                nameCol: 6, supCol: 5, jobCol: 8, locCol: 11, geoCol: 4,
                regionCol: 9, mallCol: 14, targetGeo: 'SL', vipVenues: {}
            });

            const [venueDates, setVenueDates] = useState({
                'Online Office Day': { Day1: '' },
                'Keisha Kitchenet': { Day1: '' },
                "Njoy'S Tourist And Learners' Lounge": { Day1: '' },
                'Prime Days Hotel, Naga Camarines Sur': { Day1: '', Day2: '' },
                'Zillion Builders, 7-Eleven Sabang, Lipa': { Day1: '', Day2: '' }
            });

            const [addedParticipants, setAddedParticipants] = useState([]);
            const [customSeatings, setCustomSeatings] = useState({});
            const [attendanceData, setAttendanceData] = useState({}); 

            const [scheduleData, setScheduleData] = useState(null);
            const [sortedVenues, setSortedVenues] = useState([]);
            const [activeVenue, setActiveVenue] = useState(null);
            const [activeDay, setActiveDay] = useState('Day1');
            const [viewMode, setViewMode] = useState('list'); 

            // Month & Year Shared Room ID
            const currentDate = new Date();
            const [selectedMonth, setSelectedMonth] = useState(MONTHS[currentDate.getMonth()]);
            const [selectedYear, setSelectedYear] = useState(String(currentDate.getFullYear()));
            const roomId = `${selectedMonth} ${selectedYear}`;

            const [syncStatus, setSyncStatus] = useState('connecting');
            const [showCloudModal, setShowCloudModal] = useState(false);
            const [toastMessage, setToastMessage] = useState(null);

            // Modals
            const [showDatesModal, setShowDatesModal] = useState(false);
            const [editingSeatPax, setEditingSeatPax] = useState(null);
            const [removingPax, setRemovingPax] = useState(null);

            const fileInputRef = useRef(null);
            const jsonInputRef = useRef(null);
            const isRemoteUpdate = useRef(false);

            const headerBtnBase = "h-9 px-3.5 py-1.5 bg-blue-600 text-xs text-white rounded-md font-semibold flex items-center justify-center hover:bg-blue-700 transition shadow-sm cursor-pointer border-none outline-none whitespace-nowrap";
            const headerBtnSecondary = "h-9 px-3.5 py-1.5 bg-slate-100 text-xs text-slate-700 rounded-md font-semibold flex items-center justify-center hover:bg-slate-200 transition shadow-sm cursor-pointer border-none outline-none whitespace-nowrap";

            const VENUE_CONFIG = {
                'Online Office Day': { isOneDay: true },
                'Keisha Kitchenet': { isOneDay: true },
                "Njoy'S Tourist And Learners' Lounge": { isOneDay: true },
                'Prime Days Hotel, Naga Camarines Sur': { isOneDay: false },
                'Zillion Builders, 7-Eleven Sabang, Lipa': { isOneDay: false }
            };

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3500);
            };

            const isFirstWednesdayOfMonth = (dateString) => {
                if (!dateString) return false;
                const d = new Date(dateString);
                if (isNaN(d.getTime())) return false;
                return d.getDay() === 3 && d.getDate() <= 7;
            };

            const shuffleArray = (array) => {
                const arr = [...array];
                let currentIndex = arr.length, randomIndex;
                while (currentIndex !== 0) {
                    randomIndex = Math.floor(Math.random() * currentIndex);
                    currentIndex--;
                    [arr[currentIndex], arr[randomIndex]] = [arr[randomIndex], arr[currentIndex]];
                }
                return arr;
            };

            const getPaxId = (pax) => `${pax.name}|${pax.supervisor}`;

            const getJobPriority = (job) => {
                const j = (job || '').toUpperCase();
                if (j.includes('CLUSTER LEAD')) return 1;
                if (j.includes('MALL LEADER')) return 2;
                if (j.includes('MERCHANDISER')) return 3;
                return 4;
            };

            // Order venues strictly by Total HC (Day1 + Day2) descending
            const getSortedVenuesByHC = (sData) => {
                if (!sData) return [];
                return Object.keys(sData).sort((a, b) => {
                    const totalA = (sData[a]?.Day1?.length || 0) + (sData[a]?.Day2?.length || 0);
                    const totalB = (sData[b]?.Day1?.length || 0) + (sData[b]?.Day2?.length || 0);
                    if (totalB !== totalA) return totalB - totalA;
                    return a.localeCompare(b);
                });
            };

            const determineVenue = (name, loc, sup, job, region, customConfig = mappings) => {
                const jobUpper = (job || '').toUpperCase();
                if (jobUpper.includes('MALL EXCELLENCE LEADER') || jobUpper.includes('REGIONAL EXCELLENCE LEADER')) return null;
                if (customConfig.vipVenues && customConfig.vipVenues[name]) return customConfig.vipVenues[name];

                let supUpper = (sup || '').toUpperCase();
                supUpper = supUpper.replace('BARCIA, JAYAR', 'BARCIA, JAY AR').replace('BARCIA, JAY-AR', 'BARCIA, JAY AR');

                if (supUpper.includes('MALALUAN') || supUpper.includes('FRESNILLO')) {
                    return "Njoy'S Tourist And Learners' Lounge";
                }

                const regUpper = (region || '').toUpperCase();
                if (regUpper.includes('BICOL ISLAND')) return 'Online Office Day';
                if (regUpper.includes('BICOL')) return 'Prime Days Hotel, Naga Camarines Sur';
                if (regUpper.includes('CALABARZON')) return 'Zillion Builders, 7-Eleven Sabang, Lipa';
                if (regUpper.includes('MINDORO')) return 'Keisha Kitchenet';
                if (regUpper.includes('PALAWAN')) return "Njoy'S Tourist And Learners' Lounge";

                const locUpper = (loc || '').toUpperCase();
                if (locUpper.includes('MASBATE') || locUpper.includes('VIRAC')) return 'Online Office Day';
                if (supUpper.includes('MARCIAL, KENNEDY')) return 'Keisha Kitchenet';

                return 'Zillion Builders, 7-Eleven Sabang, Lipa';
            };

            // Firestore Live Listener
            useEffect(() => {
                if (!firestoreDb) {
                    setSyncStatus('error');
                    return;
                }

                setSyncStatus('connecting');
                const docKey = `${selectedMonth}_${selectedYear}`.replace(/\s+/g, '_');
                
                const unsubscribe = firestoreDb.collection('workspaces').doc(docKey)
                    .onSnapshot((doc) => {
                        if (doc.exists) {
                            const data = doc.data();
                            isRemoteUpdate.current = true;
                            if (data.scheduleData) {
                                setScheduleData(data.scheduleData);
                                const sorted = getSortedVenuesByHC(data.scheduleData);
                                setSortedVenues(sorted);
                                setStep('dashboard');
                                if (!activeVenue || !sorted.includes(activeVenue)) {
                                    setActiveVenue(sorted[0]);
                                }
                            }
                            if (data.customSeatings) setCustomSeatings(data.customSeatings);
                            if (data.attendanceData) setAttendanceData(data.attendanceData);
                            if (data.venueDates) setVenueDates(data.venueDates);
                            if (data.addedParticipants) setAddedParticipants(data.addedParticipants);
                            if (data.mappings) setMappings(data.mappings);
                            if (data.fileName) setFileName(data.fileName);
                            
                            setTimeout(() => { isRemoteUpdate.current = false; }, 300);
                        }
                        setSyncStatus('connected');
                    }, (err) => {
                        console.error("Firestore listener error:", err);
                        setSyncStatus('error');
                    });

                return () => unsubscribe();
            }, [selectedMonth, selectedYear]);

            const pushStateToCloud = useCallback((payload) => {
                if (!firestoreDb || isRemoteUpdate.current) return;
                setSyncStatus('syncing');
                const docKey = `${selectedMonth}_${selectedYear}`.replace(/\s+/g, '_');
                firestoreDb.collection('workspaces').doc(docKey).set(payload, { merge: true })
                    .then(() => setSyncStatus('connected'))
                    .catch((err) => {
                        console.error("Firebase write error:", err);
                        setSyncStatus('error');
                    });
            }, [selectedMonth, selectedYear]);

            useEffect(() => {
                if (step !== 'dashboard' || !scheduleData || isRemoteUpdate.current) return;
                const timer = setTimeout(() => {
                    pushStateToCloud({
                        scheduleData,
                        sortedVenues,
                        customSeatings,
                        attendanceData,
                        venueDates,
                        addedParticipants,
                        mappings,
                        fileName,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }, 800);
                return () => clearTimeout(timer);
            }, [scheduleData, customSeatings, attendanceData, venueDates, addedParticipants]);

            // Load Workspace JSON File
            const handleJsonLoad = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setError('');
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const parsed = JSON.parse(evt.target.result);
                        if (!parsed.scheduleData) {
                            setError("Invalid workspace file: missing scheduleData.");
                            return;
                        }

                        const venues = getSortedVenuesByHC(parsed.scheduleData);
                        setScheduleData(parsed.scheduleData);
                        setSortedVenues(venues);
                        setActiveVenue(venues[0]);
                        setActiveDay('Day1');
                        
                        if (parsed.customSeatings) setCustomSeatings(parsed.customSeatings);
                        if (parsed.attendanceData) setAttendanceData(parsed.attendanceData);
                        if (parsed.venueDates) setVenueDates(parsed.venueDates);
                        if (parsed.addedParticipants) setAddedParticipants(parsed.addedParticipants);
                        if (parsed.mappings) setMappings(parsed.mappings);
                        if (parsed.fileName) setFileName(parsed.fileName);
                        
                        setStep('dashboard');
                        showToast("Workspace restored successfully from JSON!");

                        if (firestoreDb) {
                            pushStateToCloud({
                                scheduleData: parsed.scheduleData,
                                sortedVenues: venues,
                                customSeatings: parsed.customSeatings || {},
                                attendanceData: parsed.attendanceData || {},
                                venueDates: parsed.venueDates || venueDates,
                                addedParticipants: parsed.addedParticipants || [],
                                mappings: parsed.mappings || mappings,
                                fileName: parsed.fileName || file.name,
                                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                            });
                        }
                    } catch (err) {
                        console.error("JSON parse error:", err);
                        setError("Failed to parse JSON workspace backup file.");
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            const handleExportJson = () => {
                const stateToSave = {
                    version: "2.5",
                    savedAt: new Date().toISOString(),
                    fileName,
                    mappings,
                    venueDates,
                    scheduleData,
                    sortedVenues,
                    customSeatings,
                    attendanceData,
                    addedParticipants
                };
                const blob = new Blob([JSON.stringify(stateToSave, null, 2)], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `OD_Workspace_${selectedMonth}_${selectedYear}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast("Workspace JSON downloaded!");
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setFileName(file.name);
                setError('');
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const wb = XLSX.read(evt.target.result, { type: 'binary' });
                        const ws = wb.Sheets[wb.SheetNames[0]];
                        const data = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
                        
                        const headerRowIndex = 5;
                        if (data.length <= headerRowIndex) {
                            setError("File too short. Headers must be on row 6."); return;
                        }
                        const extractedHeaders = data[headerRowIndex].map((h, i) => ({
                            index: i, label: h ? `${XLSX.utils.encode_col(i)} - ${h}` : `${XLSX.utils.encode_col(i)} - (Empty)`
                        }));
                        setHeaders(extractedHeaders);
                        setRawData(data.slice(headerRowIndex + 1)); 
                        setAddedParticipants([]); 
                        setCustomSeatings({});
                        setAttendanceData({});
                        setStep('mapping');
                    } catch (err) { setError("Failed to parse Excel file."); }
                };
                reader.readAsBinaryString(file);
            };

            // Schedule Processing (With Automatic Fallback to avoid Blank Dashboard)
            const processSchedule = (isShuffle = false) => {
                const { nameCol, supCol, jobCol, locCol, geoCol, regionCol, mallCol, targetGeo } = mappings;
                
                const result = {};
                Object.keys(VENUE_CONFIG).forEach(v => {
                    result[v] = { isOneDay: VENUE_CONFIG[v].isOneDay, Day1: [], Day2: [] };
                });

                const seenNames = new Set();
                let validParticipants = [];
                
                // Reconstruct from rawData if available
                if (rawData && rawData.length > 0) {
                    rawData.forEach(row => {
                        let supervisorName = (row[supCol] || "").toString().trim().toUpperCase();
                        supervisorName = supervisorName.replace("BARCIA, JAYAR", "BARCIA, JAY AR").replace("BARCIA, JAY-AR", "BARCIA, JAY AR");
                        
                        const name = (row[nameCol] || "").toString().trim();
                        const job = (row[jobCol] || "").toString().trim().toUpperCase();
                        const geo = (row[geoCol] || "").toString().trim().toUpperCase();
                        const region = (row[regionCol] || "").toString().trim().toUpperCase();
                        const mall = (row[mallCol] || "").toString().trim().toUpperCase();
                        
                        if (!name || seenNames.has(name)) return; 
                        if (job.includes('MALL EXCELLENCE LEADER') || job.includes('REGIONAL EXCELLENCE LEADER')) return;

                        const isPromoter = job.includes('PROMOTER') || job.includes('PROMO');
                        const isSpecialJob = job.includes('CLUSTER LEAD') || job.includes('MALL LEADER') || job.includes('MERCHANDISER');
                        if (!isPromoter && !isSpecialJob) return;

                        if (targetGeo && geo !== targetGeo.toUpperCase()) return;
                        seenNames.add(name);
                        
                        validParticipants.push({
                            name, supervisor: supervisorName, job,
                            location: (row[locCol] || "").toString().trim().toUpperCase(),
                            geo, region, mall, isManual: false
                        });
                    });
                } else if (scheduleData) {
                    // Safe Recovery: Extract active participants directly from scheduleData so Shuffle never blanks!
                    Object.keys(scheduleData).forEach(v => {
                        ['Day1', 'Day2'].forEach(d => {
                            (scheduleData[v][d] || []).forEach(p => {
                                if (!seenNames.has(p.name)) {
                                    seenNames.add(p.name);
                                    validParticipants.push({ ...p });
                                }
                            });
                        });
                    });
                }

                if (validParticipants.length === 0) {
                    showToast("No participants found to process.");
                    return;
                }

                let twoDayPools = { 'Prime Days Hotel, Naga Camarines Sur': [], 'Zillion Builders, 7-Eleven Sabang, Lipa': [] };

                validParticipants.forEach(p => {
                    const venue = determineVenue(p.name, p.location, p.supervisor, p.job, p.region, mappings);
                    if (!venue) return; 
                    if (VENUE_CONFIG[venue].isOneDay) {
                        result[venue].Day1.push(p);
                    } else {
                        twoDayPools[venue].push(p);
                    }
                });

                // Balancing 2-day venues (Supervisor 50/50 split + Operator Promoter restriction + Mall balancing)
                Object.keys(twoDayPools).forEach(venue => {
                    const pool = twoDayPools[venue];
                    const d1Date = venueDates[venue]?.Day1;
                    const d2Date = venueDates[venue]?.Day2;
                    const d1IsFirstWed = isFirstWednesdayOfMonth(d1Date);
                    const d2IsFirstWed = isFirstWednesdayOfMonth(d2Date);

                    const supGroups = {};
                    pool.forEach(p => {
                        if (!supGroups[p.supervisor]) supGroups[p.supervisor] = [];
                        supGroups[p.supervisor].push(p);
                    });

                    Object.keys(supGroups).sort().forEach(sup => {
                        let team = [...supGroups[sup]];
                        
                        if (!isShuffle) {
                            team.sort((a,b) => {
                                const pA = getJobPriority(a.job), pB = getJobPriority(b.job);
                                if (pA !== pB) return pA - pB;
                                const mallCmp = (a.mall || '').localeCompare(b.mall || '');
                                if (mallCmp !== 0) return mallCmp;
                                return (a.name || '').localeCompare(b.name || '');
                            });
                        } else {
                            team = shuffleArray(team);
                        }

                        let d1 = [], d2 = [];
                        
                        team.forEach(p => {
                            const isOperator = p.job.includes('OPERATOR');
                            if (isOperator && d1IsFirstWed) {
                                d2.push(p);
                            } else if (isOperator && d2IsFirstWed) {
                                d1.push(p);
                            } else {
                                const pMall = (p.mall || '').trim();
                                if (pMall) {
                                    const d1MallCount = d1.filter(x => (x.mall||'').trim() === pMall).length;
                                    const d2MallCount = d2.filter(x => (x.mall||'').trim() === pMall).length;
                                    if (d1MallCount < d2MallCount) { d1.push(p); return; }
                                    if (d2MallCount < d1MallCount) { d2.push(p); return; }
                                }
                                if (d1.length <= d2.length) d1.push(p);
                                else d2.push(p);
                            }
                        });

                        result[venue].Day1.push(...d1);
                        result[venue].Day2.push(...d2);
                    });
                });

                // Add manual additions
                addedParticipants.forEach(p => {
                    const venue = determineVenue(p.name, p.location, p.supervisor, p.job, p.region, mappings);
                    if (!venue) return;
                    if (VENUE_CONFIG[venue].isOneDay) {
                        result[venue].Day1.push(p);
                    } else {
                        const targetDay = p.assignedDay || (result[venue].Day1.length <= result[venue].Day2.length ? 'Day1' : 'Day2');
                        result[venue][targetDay].push(p);
                    }
                });

                // Front seat priority: VIP non-promoters first
                Object.keys(result).forEach(v => {
                    ['Day1', 'Day2'].forEach(d => {
                        result[v][d].sort((a,b) => getJobPriority(a.job) - getJobPriority(b.job) || a.name.localeCompare(b.name));
                    });
                });

                // Strict Headcount Sorting: Largest HC to Smallest
                const sortedNames = getSortedVenuesByHC(result);
                
                setSortedVenues(sortedNames);
                setScheduleData(result);
                if (isShuffle) setCustomSeatings({});
                if (step !== 'dashboard') {
                    setActiveVenue(sortedNames[0]);
                    setActiveDay('Day1');
                    setStep('dashboard');
                }
                showToast(isShuffle ? "Teams shuffled successfully!" : "Schedule generated!");
            };

            const handleRemovePax = (pax) => {
                const paxId = getPaxId(pax);
                setScheduleData(prev => {
                    const next = { ...prev };
                    Object.keys(next).forEach(v => {
                        ['Day1', 'Day2'].forEach(d => {
                            next[v][d] = next[v][d].filter(p => getPaxId(p) !== paxId);
                        });
                    });
                    const updatedSorted = getSortedVenuesByHC(next);
                    setSortedVenues(updatedSorted);
                    return next;
                });

                setCustomSeatings(prev => {
                    const next = { ...prev };
                    Object.keys(next).forEach(k => {
                        if (next[k]?.grid) {
                            next[k].grid = next[k].grid.map(p => p && getPaxId(p) === paxId ? null : p);
                        }
                    });
                    return next;
                });

                setAddedParticipants(prev => prev.filter(p => getPaxId(p) !== paxId));
                setRemovingPax(null);
                setEditingSeatPax(null);
                showToast(`Removed ${pax.name} from schedule.`);
            };

            const handleMoveDay = (pax, targetDay) => {
                if (!activeVenue || VENUE_CONFIG[activeVenue].isOneDay) return;
                const paxId = getPaxId(pax);
                const currentDay = activeVenue && scheduleData[activeVenue].Day1.some(p => getPaxId(p) === paxId) ? 'Day1' : 'Day2';
                if (currentDay === targetDay) return;

                if (pax.job.includes('OPERATOR') && isFirstWednesdayOfMonth(venueDates[activeVenue]?.[targetDay])) {
                    showToast(`⚠️ Operator Promoters cannot be scheduled on the 1st Wednesday (${venueDates[activeVenue]?.[targetDay]})!`);
                    return;
                }

                setScheduleData(prev => {
                    const next = { ...prev };
                    const vData = { ...next[activeVenue] };
                    vData[currentDay] = vData[currentDay].filter(p => getPaxId(p) !== paxId);
                    vData[targetDay] = [...vData[targetDay], pax].sort((a,b) => getJobPriority(a.job) - getJobPriority(b.job) || a.name.localeCompare(b.name));
                    next[activeVenue] = vData;
                    return next;
                });

                const currentSeatKey = `${activeVenue}_${currentDay}`;
                const targetSeatKey = `${activeVenue}_${targetDay}`;
                setCustomSeatings(prev => {
                    const next = { ...prev };
                    if (next[currentSeatKey]?.grid) {
                        next[currentSeatKey].grid = next[currentSeatKey].grid.map(p => p && getPaxId(p) === paxId ? null : p);
                    }
                    if (next[targetSeatKey]?.grid) {
                        const grid = [...next[targetSeatKey].grid];
                        const emptyIdx = grid.indexOf(null);
                        if (emptyIdx !== -1) grid[emptyIdx] = pax;
                        else grid.push(pax);
                        next[targetSeatKey] = { ...next[targetSeatKey], grid };
                    }
                    return next;
                });

                showToast(`Rescheduled ${pax.name} to ${targetDay}.`);
            };

            // Seating Chart Logic: Columns, Rows & Shuffle Seat layout
            const currentSeatKey = `${activeVenue}_${activeDay}`;
            const activeSeatConfig = customSeatings[currentSeatKey] || { cols: 5, grid: null };
            const currentCols = activeSeatConfig.cols || 5;

            // Compute seating list: front seats priority for VIP
            const attendeesList = scheduleData?.[activeVenue]?.[activeDay] || [];
            const seatingGrid = useMemo(() => {
                if (activeSeatConfig.grid && activeSeatConfig.grid.length > 0) {
                    return activeSeatConfig.grid;
                }
                return [...attendeesList].sort((a,b) => getJobPriority(a.job) - getJobPriority(b.job) || a.name.localeCompare(b.name));
            }, [activeSeatConfig.grid, attendeesList]);

            const updateGridCols = (newCols) => {
                const safeCols = Math.max(2, Math.min(10, newCols));
                setCustomSeatings(prev => ({
                    ...prev,
                    [currentSeatKey]: {
                        ...prev[currentSeatKey],
                        cols: safeCols,
                        grid: seatingGrid
                    }
                }));
            };

            const handleShuffleSeatPositions = () => {
                // Shuffle seating cards while keeping VIPs in the front row
                const vips = seatingGrid.filter(p => p && getJobPriority(p.job) <= 3);
                const regulars = seatingGrid.filter(p => p && getJobPriority(p.job) > 3);
                const nulls = seatingGrid.filter(p => p === null);

                const shuffledRegulars = shuffleArray(regulars);
                const newGrid = [...vips, ...shuffledRegulars, ...nulls];

                setCustomSeatings(prev => ({
                    ...prev,
                    [currentSeatKey]: {
                        ...prev[currentSeatKey],
                        cols: currentCols,
                        grid: newGrid
                    }
                }));
                showToast("Seating layout randomized (VIPs kept at front)!");
            };

            // Month / Year Cloud Workspace Modal
            const CloudSyncModal = () => {
                if (!showCloudModal) return null;
                const shareUrl = `${window.location.origin}${window.location.pathname}?month=${selectedMonth}&year=${selectedYear}`;

                return (
                    <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-50 p-4 fade-in backdrop-blur-sm">
                        <div className="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden">
                            <div className="px-5 py-4 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                                <h3 className="font-bold text-slate-800 flex items-center text-sm"><IconCloud /> Live Cloud Sync Workspace</h3>
                                <button type="button" onClick={() => setShowCloudModal(false)} className="text-slate-400 hover:text-slate-600"><IconClose /></button>
                            </div>
                            <div className="p-5 space-y-4">
                                <div className="bg-slate-50 p-3 rounded-lg border border-slate-200 flex justify-between items-center">
                                    <span className="text-xs font-semibold text-slate-600">Database Status:</span>
                                    <div className="flex items-center gap-1.5">
                                        <span className={`w-2.5 h-2.5 rounded-full ${syncStatus === 'connected' ? 'bg-emerald-500' : syncStatus === 'syncing' ? 'bg-amber-500 animate-pulse' : 'bg-red-500'}`}></span>
                                        <span className="text-xs font-bold capitalize">{syncStatus}</span>
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">Select Month</label>
                                        <select value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)} className="w-full border rounded-md p-2 text-xs font-bold bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                                            {MONTHS.map(m => <option key={m} value={m}>{m}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">Select Year</label>
                                        <select value={selectedYear} onChange={e => setSelectedYear(e.target.value)} className="w-full border rounded-md p-2 text-xs font-bold bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                                            {YEARS.map(y => <option key={y} value={y}>{y}</option>)}
                                        </select>
                                    </div>
                                </div>

                                <div className="bg-blue-50 border border-blue-200 p-2.5 rounded-lg text-xs text-blue-900 font-semibold text-center">
                                    Current Workspace: <strong>{selectedMonth} {selectedYear}</strong>
                                </div>

                                <div className="pt-2">
                                    <label className="block text-xs font-bold text-slate-700 mb-1">Shareable Team Link</label>
                                    <div className="flex gap-2">
                                        <input type="text" readOnly value={shareUrl} className="w-full border rounded-md px-2 py-1.5 text-xs text-slate-600 bg-slate-50" />
                                        <button type="button" onClick={() => {
                                            navigator.clipboard.writeText(shareUrl);
                                            showToast("Shareable link copied to clipboard!");
                                        }} className="px-3 py-1.5 bg-slate-200 text-slate-700 hover:bg-slate-300 rounded-md text-xs font-bold whitespace-nowrap">Copy</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            // Set Venue Dates Modal
            const VenueDatesModal = () => {
                if (!showDatesModal) return null;
                return (
                    <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-50 p-4 fade-in backdrop-blur-sm">
                        <div className="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden">
                            <div className="px-5 py-4 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                                <h3 className="font-bold text-slate-800 flex items-center text-sm"><IconCalendar /> Set Training Dates</h3>
                                <button type="button" onClick={() => setShowDatesModal(false)} className="text-slate-400 hover:text-slate-600"><IconClose /></button>
                            </div>
                            <div className="p-5 space-y-4 max-h-[70vh] overflow-y-auto custom-scrollbar">
                                <div className="bg-amber-50 border border-amber-200 p-2.5 rounded-lg text-xs text-amber-800 flex items-start">
                                    <IconAlert className="w-4 h-4 mr-1.5 mt-0.5" />
                                    <span><strong>Rule:</strong> Operator Promoters cannot be scheduled on the <strong>first Wednesday</strong> of any month.</span>
                                </div>
                                {Object.keys(VENUE_CONFIG).map(v => (
                                    <div key={v} className="bg-slate-50 p-3 rounded-lg border border-slate-200">
                                        <span className="text-xs font-bold text-slate-700 block mb-2">{v}</span>
                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="text-[10px] font-semibold text-slate-500">Day 1 Date</label>
                                                <input type="date" value={venueDates[v]?.Day1 || ''} onChange={e => {
                                                    const d = e.target.value;
                                                    setVenueDates(prev => ({ ...prev, [v]: { ...prev[v], Day1: d } }));
                                                }} className="w-full border rounded p-1.5 text-xs bg-white" />
                                                {isFirstWednesdayOfMonth(venueDates[v]?.Day1) && (
                                                    <span className="text-[9px] font-bold text-red-600 block mt-0.5">⚠️ 1st Wednesday of Month</span>
                                                )}
                                            </div>
                                            {!VENUE_CONFIG[v].isOneDay && (
                                                <div>
                                                    <label className="text-[10px] font-semibold text-slate-500">Day 2 Date</label>
                                                    <input type="date" value={venueDates[v]?.Day2 || ''} onChange={e => {
                                                        const d = e.target.value;
                                                        setVenueDates(prev => ({ ...prev, [v]: { ...prev[v], Day2: d } }));
                                                    }} className="w-full border rounded p-1.5 text-xs bg-white" />
                                                    {isFirstWednesdayOfMonth(venueDates[v]?.Day2) && (
                                                        <span className="text-[9px] font-bold text-red-600 block mt-0.5">⚠️ 1st Wednesday of Month</span>
                                                    )}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                ))}
                                <div className="flex justify-end pt-2">
                                    <button type="button" onClick={() => {
                                        setShowDatesModal(false);
                                        processSchedule(false);
                                    }} className="px-5 py-2 bg-blue-600 text-white font-bold text-xs rounded-md shadow hover:bg-blue-700">Save & Apply Dates</button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            // Attendance & Remarks Modal
            const AttendanceModal = () => {
                if (!editingSeatPax) return null;
                const paxId = getPaxId(editingSeatPax);
                const currentData = attendanceData[paxId] || { status: 'Present', violation: false, remarks: '' };
                
                const [status, setStatus] = useState(currentData.status);
                const [violation, setViolation] = useState(currentData.violation);
                const [remarks, setRemarks] = useState(currentData.remarks);

                const handleSave = () => {
                    setAttendanceData(prev => ({ ...prev, [paxId]: { status, violation, remarks } }));
                    setEditingSeatPax(null);
                    showToast(`Updated attendance for ${editingSeatPax.name}`);
                };

                return (
                    <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-50 p-4 fade-in backdrop-blur-sm">
                        <div className="bg-white rounded-xl shadow-2xl w-full max-w-sm overflow-hidden">
                            <div className="px-5 py-4 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                                <h3 className="font-bold text-slate-800 text-sm">Attendance & Remarks</h3>
                                <button type="button" onClick={() => setEditingSeatPax(null)} className="text-slate-400 hover:text-slate-600"><IconClose /></button>
                            </div>
                            <div className="p-5 space-y-4">
                                <div className="bg-slate-100 p-2.5 rounded text-center">
                                    <span className="text-xs font-bold text-slate-800 block">{editingSeatPax.name}</span>
                                    <span className="text-[10px] text-slate-500 font-semibold">{editingSeatPax.job} • {editingSeatPax.supervisor}</span>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1">Status</label>
                                    <div className="flex gap-2">
                                        {['Present', 'Late', 'Absent'].map(s => (
                                            <button key={s} type="button" onClick={() => setStatus(s)}
                                                className={`flex-1 py-1.5 text-xs font-bold rounded border ${status === s ? (s==='Present'?'bg-emerald-100 border-emerald-500 text-emerald-800' : s==='Late'?'bg-orange-100 border-orange-500 text-orange-800':'bg-red-100 border-red-500 text-red-800') : 'bg-white border-slate-300 text-slate-500 hover:bg-slate-50'}`}>
                                                {s}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div className="flex items-center gap-2 pt-1">
                                    <input type="checkbox" id="violCheck" checked={violation} onChange={e=>setViolation(e.target.checked)} className="w-4 h-4 text-blue-600 rounded border-slate-300 cursor-pointer" />
                                    <label htmlFor="violCheck" className="text-xs font-bold text-slate-700 cursor-pointer select-none">Mark One Look Violation ⚠️</label>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1">Remarks</label>
                                    <textarea value={remarks} onChange={e=>setRemarks(e.target.value)} className="w-full border border-slate-300 rounded p-2 text-xs focus:ring-2 focus:ring-blue-500 outline-none min-h-[60px]" placeholder="Add reason, grooming, or notes..."></textarea>
                                </div>
                                <div className="pt-2 border-t border-slate-100 flex gap-2">
                                    <button type="button" onClick={() => setRemovingPax(editingSeatPax)} className="px-3 py-2 rounded text-xs font-bold text-red-600 hover:bg-red-50 border border-red-200">Resigned</button>
                                    <button type="button" onClick={handleSave} className="flex-1 px-4 py-2 rounded text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 shadow-sm">Save Changes</button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            // Resigned Confirmation Modal
            const RemoveConfirmModal = () => {
                if (!removingPax) return null;
                return (
                    <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-50 p-4 fade-in backdrop-blur-sm">
                        <div className="bg-white rounded-xl shadow-2xl w-full max-w-sm overflow-hidden p-5">
                            <h3 className="font-bold text-slate-800 text-sm mb-2 text-red-600 flex items-center"><IconAlert className="w-4 h-4 mr-1.5" /> Confirm Resignation</h3>
                            <p className="text-xs text-slate-600 mb-4">
                                Are you sure you want to remove <strong>{removingPax.name}</strong> from the schedule? Their seating position will be kept as an empty vacant seat so layout remains intact.
                            </p>
                            <div className="flex justify-end gap-2">
                                <button type="button" onClick={() => setRemovingPax(null)} className="px-3 py-1.5 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded">Cancel</button>
                                <button type="button" onClick={() => handleRemovePax(removingPax)} className="px-4 py-1.5 text-xs font-bold text-white bg-red-600 hover:bg-red-700 rounded shadow-sm">Confirm Remove</button>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-20">
                        <div className="w-full px-3 md:px-5 h-[56px] flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <h1 className="text-sm font-bold text-slate-800 tracking-tight flex items-center">
                                    Promoter Training Dashboard
                                </h1>
                                <button type="button" onClick={() => setShowCloudModal(true)} className="flex items-center gap-1.5 px-3 py-1 bg-slate-100 hover:bg-slate-200 rounded-full text-xs font-bold text-slate-700 transition">
                                    <span className={`w-2 h-2 rounded-full ${syncStatus === 'connected' ? 'bg-emerald-500' : syncStatus === 'syncing' ? 'bg-amber-500 animate-pulse' : 'bg-red-500'}`}></span>
                                    <span>Cloud: {selectedMonth} {selectedYear}</span>
                                </button>
                            </div>
                            
                            <div className="flex items-center gap-2 overflow-x-auto custom-scrollbar">
                                {step === 'dashboard' && (
                                    <>
                                        <button type="button" onClick={handleExportJson} className={headerBtnSecondary}>
                                            <IconSaveFile /> Save Workspace
                                        </button>
                                        <button type="button" onClick={() => setShowDatesModal(true)} className={headerBtnBase}>
                                            <IconCalendar /> Training Dates
                                        </button>
                                        <button type="button" onClick={() => processSchedule(true)} className={headerBtnBase}>
                                            <IconShuffle /> Shuffle
                                        </button>
                                    </>
                                )}
                                
                                <label className={headerBtnSecondary + " cursor-pointer m-0"}>
                                    <IconFolderOpen /> Load JSON
                                    <input type="file" ref={jsonInputRef} className="hidden" accept=".json" onChange={handleJsonLoad} />
                                </label>

                                <label className={headerBtnBase + " cursor-pointer m-0"}>
                                    <IconUpload /> Upload Excel
                                    <input type="file" ref={fileInputRef} className="hidden" accept=".xlsx, .xls" onChange={handleFileUpload} />
                                </label>
                            </div>
                        </div>
                    </header>

                    {toastMessage && (
                        <div className="fixed bottom-5 right-5 bg-slate-800 text-white text-xs font-semibold px-4 py-2.5 rounded-lg shadow-xl z-50 fade-in border border-slate-700 flex items-center">
                            {toastMessage}
                        </div>
                    )}

                    <main className="w-full flex-grow p-3 md:p-5">
                        {step === 'upload' && (
                            <div className="max-w-md mx-auto mt-16 fade-in text-center bg-white p-8 rounded-xl shadow-sm border border-slate-200 space-y-4">
                                <div>
                                    <h2 className="text-base font-bold text-slate-800 mb-1">Load Training Schedule</h2>
                                    <p className="text-slate-500 text-xs">Choose how you would like to load your workspace</p>
                                </div>

                                <button type="button" onClick={() => jsonInputRef.current.click()} className="w-full border-2 border-emerald-300 hover:border-emerald-500 rounded-lg p-5 bg-emerald-50/50 transition cursor-pointer flex flex-col items-center justify-center">
                                    <span className="text-emerald-700 font-bold text-sm flex items-center mb-1">
                                        <IconFolderOpen /> Load Saved Workspace (.json)
                                    </span>
                                    <span className="text-[11px] text-emerald-600">Restores previous schedule, attendance, and seating</span>
                                </button>

                                <div className="flex items-center gap-2">
                                    <hr className="flex-1 border-slate-200" />
                                    <span className="text-[10px] text-slate-400 uppercase font-bold">or</span>
                                    <hr className="flex-1 border-slate-200" />
                                </div>

                                <button type="button" onClick={() => fileInputRef.current.click()} className="w-full border-2 border-dashed border-blue-300 hover:border-blue-500 rounded-lg p-5 bg-blue-50/50 transition cursor-pointer flex flex-col items-center justify-center">
                                    <span className="text-blue-600 font-bold text-xs flex items-center mb-1">
                                        <IconUpload /> Upload New Excel (.xlsx)
                                    </span>
                                    <span className="text-[11px] text-blue-500">Imports fresh raw schedule workbook</span>

                                {error && <div className="mt-3 text-red-600 text-xs font-bold bg-red-50 p-2 rounded">{error}</div>}
                            </div>
                        )}

                        {step === 'mapping' && (
                            <div className="max-w-4xl mx-auto bg-white rounded-xl shadow-sm border border-slate-200 p-5 fade-in">
                                <h3 className="font-bold text-slate-800 text-sm mb-1 flex items-center"><IconSettings /> Column Mappings</h3>
                                <p className="text-xs text-slate-500 mb-4">Confirm column headers read from row 6.</p>
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
                                    {[
                                        { key: 'nameCol', label: 'Name' },
                                        { key: 'supCol', label: 'Supervisor' },
                                        { key: 'jobCol', label: 'Job Role' },
                                        { key: 'regionCol', label: 'Region (Col J)' },
                                        { key: 'mallCol', label: 'Mall (Col O)' },
                                        { key: 'locCol', label: 'Location' },
                                        { key: 'geoCol', label: 'Geo Area' }
                                    ].map(item => (
                                        <div key={item.key}>
                                            <label className="text-[11px] font-bold text-slate-600 mb-1 block">{item.label}</label>
                                            <select value={mappings[item.key]} onChange={e=>setMappings({...mappings, [item.key]: Number(e.target.value)})} className="w-full border rounded p-1.5 text-xs bg-slate-50">
                                                {headers.map(h => <option key={h.index} value={h.index}>{h.label}</option>)}
                                            </select>
                                        </div>
                                    ))}
                                </div>
                                <div className="flex justify-end">
                                    <button type="button" onClick={() => processSchedule(false)} className="px-6 py-2 bg-blue-600 text-white rounded font-bold text-xs hover:bg-blue-700">Generate Schedule</button>
                                </div>
                            </div>
                        )}

                        {step === 'dashboard' && scheduleData && (
                            <div className="space-y-4 fade-in">
                                {/* Venue Navigation Tabs - Strictly Sorted Largest Headcount to Smallest */}
                                <div className="bg-white p-1.5 rounded-xl shadow-sm border border-slate-200 flex flex-wrap gap-1.5">
                                    {sortedVenues.map(v => {
                                        const isActive = activeVenue === v;
                                        const count = (scheduleData[v]?.Day1?.length || 0) + (scheduleData[v]?.Day2?.length || 0);
                                        return (
                                            <button key={v} type="button" onClick={() => setActiveVenue(v)}
                                                className={`flex-1 p-2 rounded-lg text-left transition border ${isActive ? 'bg-blue-50 border-blue-200' : 'border-transparent hover:bg-slate-50'}`}>
                                                <div className="flex justify-between items-center text-[11px] font-bold">
                                                    <span className={isActive ? 'text-blue-900' : 'text-slate-600'}>{v}</span>
                                                    <span className={`px-2 py-0.5 rounded font-bold text-[10px] ${isActive ? 'bg-blue-600 text-white' : 'bg-slate-200 text-slate-700'}`}>{count}</span>
                                                </div>
                                            </button>
                                        );
                                    })}
                                </div>

                                {/* Active Venue Header & Seating Controls */}
                                <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
                                    <div className="flex flex-wrap justify-between items-center border-b pb-3 mb-4 gap-2">
                                        <div className="flex items-center gap-2">
                                            <button type="button" onClick={() => setActiveDay('Day1')} className={`px-4 py-1.5 rounded text-xs font-bold ${activeDay === 'Day1' ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600'}`}>
                                                Day 1 ({scheduleData[activeVenue]?.Day1?.length || 0}) {venueDates[activeVenue]?.Day1 && `• ${venueDates[activeVenue]?.Day1}`}
                                            </button>
                                            {!VENUE_CONFIG[activeVenue]?.isOneDay && (
                                                <button type="button" onClick={() => setActiveDay('Day2')} className={`px-4 py-1.5 rounded text-xs font-bold ${activeDay === 'Day2' ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600'}`}>
                                                    Day 2 ({scheduleData[activeVenue]?.Day2?.length || 0}) {venueDates[activeVenue]?.Day2 && `• ${venueDates[activeVenue]?.Day2}`}
                                                </button>
                                            )}
                                        </div>

                                        <div className="flex items-center gap-3">
                                            {/* Columns and Rows custom controls when in Seating view */}
                                            {viewMode === 'seating' && (
                                                <div className="flex items-center gap-2 bg-slate-50 px-3 py-1 rounded-lg border border-slate-200">
                                                    <span className="text-xs font-bold text-slate-600">Columns:</span>
                                                    <button type="button" onClick={() => updateGridCols(currentCols - 1)} className="w-6 h-6 flex items-center justify-center bg-white border border-slate-300 rounded font-bold text-xs hover:bg-slate-100">-</button>
                                                    <span className="text-xs font-bold text-blue-600 w-4 text-center">{currentCols}</span>
                                                    <button type="button" onClick={() => updateGridCols(currentCols + 1)} className="w-6 h-6 flex items-center justify-center bg-white border border-slate-300 rounded font-bold text-xs hover:bg-slate-100">+</button>
                                                    <span className="text-slate-300 mx-1">|</span>
                                                    <span className="text-xs text-slate-500 font-semibold">Rows: {Math.ceil(seatingGrid.length / currentCols) || 1}</span>
                                                    <button type="button" onClick={handleShuffleSeatPositions} className="ml-2 px-2.5 py-1 bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 rounded text-[11px] font-bold">
                                                        Shuffle Seats
                                                    </button>
                                                </div>
                                            )}

                                            <button type="button" onClick={() => setViewMode(viewMode === 'list' ? 'seating' : 'list')} className="px-3.5 py-1.5 bg-slate-100 text-slate-700 hover:bg-slate-200 rounded text-xs font-bold">
                                                {viewMode === 'list' ? 'Switch to Seating View' : 'Switch to List View'}
                                            </button>
                                        </div>
                                    </div>

                                    {/* Attendees List View */}
                                    {viewMode === 'list' ? (
                                        <div className="grid grid-cols-1 md:grid-cols-3 xl:grid-cols-4 gap-3">
                                            {scheduleData[activeVenue]?.[activeDay]?.map((p, i) => {
                                                const paxId = getPaxId(p);
                                                const att = attendanceData[paxId] || { status: 'Present' };
                                                const isOperator = p.job.includes('OPERATOR');
                                                return (
                                                    <div key={paxId + i} className={`p-3 rounded-lg border flex flex-col justify-between ${att.status === 'Absent' ? 'bg-red-50 border-red-200' : att.status === 'Late' ? 'bg-orange-50 border-orange-200' : 'bg-white border-slate-200'}`}>
                                                        <div>
                                                            <div className="flex justify-between items-start">
                                                                <span className="text-xs font-bold text-slate-800">{p.name}</span>
                                                                <div className="flex items-center gap-1">
                                                                    {isOperator && <span className="text-[8px] bg-purple-100 text-purple-700 px-1 py-0.5 rounded font-bold">OP.PROMO</span>}
                                                                    <button type="button" onClick={() => setEditingSeatPax(p)} className="text-slate-400 hover:text-blue-600"><IconEdit /></button>
                                                                    <button type="button" onClick={() => setRemovingPax(p)}><IconTrash /></button>
                                                                </div>
                                                            </div>
                                                            <span className="text-[10px] text-slate-500 block">{p.job} • {p.supervisor}</span>
                                                            {p.mall && <span className="text-[9px] font-semibold text-emerald-700 block mt-1">🏬 {p.mall}</span>}
                                                            {att.violation && <span className="text-[9px] text-amber-700 font-bold block mt-0.5">⚠️ Infraction</span>}
                                                            {att.remarks && <span className="text-[9px] text-slate-600 italic block mt-0.5">"{att.remarks}"</span>}
                                                        </div>
                                                        {!VENUE_CONFIG[activeVenue]?.isOneDay && (
                                                            <div className="mt-2 pt-2 border-t border-slate-100 flex justify-end">
                                                                <button type="button" onClick={() => handleMoveDay(p, activeDay === 'Day1' ? 'Day2' : 'Day1')} className="text-[10px] text-blue-600 hover:underline font-bold">
                                                                    Move to {activeDay === 'Day1' ? 'Day 2' : 'Day 1'} ⇄
                                                                </button>
                                                            </div>
                                                        )}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    ) : (
                                        /* Interactive Seating Canvas with Column/Row configuration */
                                        <div className="p-4 bg-slate-50 rounded-xl">
                                            {/* Stage / Screen indicator */}
                                            <div className="max-w-md mx-auto mb-6 py-1.5 bg-slate-200 border border-slate-300 rounded text-center text-[11px] font-bold text-slate-600 tracking-wider uppercase">
                                                FRONT / PRESENTATION SCREEN
                                            </div>

                                            <div 
                                                className="grid gap-2.5 max-w-5xl mx-auto"
                                                style={{ gridTemplateColumns: `repeat(${currentCols}, minmax(0, 1fr))` }}
                                            >
                                                {seatingGrid.map((p, idx) => {
                                                    if (!p) {
                                                        return (
                                                            <div key={idx} className="border-2 border-dashed border-slate-200 bg-white/40 rounded-lg p-3 text-center min-h-[75px] flex items-center justify-center">
                                                                <span className="text-[10px] text-slate-300 font-semibold">Empty Seat {idx + 1}</span>
                                                            </div>
                                                        );
                                                    }
                                                    const paxId = getPaxId(p);
                                                    const att = attendanceData[paxId] || { status: 'Present' };
                                                    const isVIP = getJobPriority(p.job) <= 3;
                                                    const isOperator = p.job.includes('OPERATOR');

                                                    return (
                                                        <div 
                                                            key={paxId + idx} 
                                                            onClick={() => setEditingSeatPax(p)} 
                                                            className={`border rounded-lg p-2.5 text-center cursor-pointer transition shadow-sm hover:shadow-md hover:border-blue-400 min-h-[75px] flex flex-col justify-between ${att.status === 'Absent' ? 'bg-red-50 border-red-300' : att.status === 'Late' ? 'bg-orange-50 border-orange-300' : isVIP ? 'bg-amber-50/70 border-amber-300' : 'bg-white border-slate-200'}`}
                                                        >
                                                            <div className="flex justify-between items-center text-[9px] text-slate-400 font-bold mb-0.5">
                                                                <span>Seat {idx + 1}</span>
                                                                {isVIP && <span className="text-[8px] bg-amber-200 text-amber-800 px-1 py-0.2 rounded font-bold">FRONT VIP</span>}
                                                                {isOperator && <span className="text-[8px] bg-purple-100 text-purple-700 px-1 py-0.2 rounded font-bold">OP.PROMO</span>}
                                                            </div>
                                                            <div>
                                                                <span className="text-[11px] font-bold text-slate-800 block truncate">{p.name}</span>
                                                                <span className="text-[9px] text-slate-500 block truncate">{p.supervisor}</span>
                                                            </div>
                                                            <div className="mt-1 flex items-center justify-between text-[8px]">
                                                                <span className="text-emerald-700 truncate font-semibold">{p.mall || ''}</span>
                                                                {att.status !== 'Present' && (
                                                                    <span className={`font-bold px-1 rounded ${att.status === 'Absent' ? 'bg-red-200 text-red-800' : 'bg-orange-200 text-orange-800'}`}>{att.status}</span>
                                                                )}
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </main>

                    <CloudSyncModal />
                    <VenueDatesModal />
                    <AttendanceModal />
                    <RemoveConfirmModal />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
