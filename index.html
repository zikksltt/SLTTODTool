                                                                <span className="text-[10px] text-slate-500 font-semibold">Day 2:</span>
                                                                <input 
                                                                    type="date" 
                                                                    value={curDates.Day2 || ''} 
                                                                    onChange={e => setLocalDates({ ...localDates, [v]: { ...curDates, Day2: e.target.value } })}
                                                                    className="border border-slate-300 rounded px-1.5 py-0.5 text-[11px] bg-white outline-none w-32"
                                                                />
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                {/* Step 3: Tap-to-Assign Leadership Staff */}
                                {detectedVips.length > 0 && (
                                    <div className="pt-3 border-t border-slate-100">
                                        <h4 className="text-xs font-bold text-slate-700 mb-1">Tap-to-Assign Leadership & Support Staff</h4>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-2.5 max-h-56 overflow-y-auto p-2 bg-slate-50 rounded border border-slate-200 custom-scrollbar">
                                            {detectedVips.map(vip => {
                                                const currentAssigned = localVipVenues[vip.name] || mappings.vipVenues?.[vip.name] || determineVenue(vip.name, '', '', vip.job, '', mappings);
                                                return (
                                                    <div key={vip.name} className="flex flex-col bg-white p-2.5 rounded border border-slate-200 shadow-2xs gap-1.5">
                                                        <div className="flex justify-between items-center">
                                                            <span className="text-xs font-bold text-slate-800 truncate" title={vip.name}>{vip.name}</span>
                                                            <span className="text-[9px] font-semibold text-blue-700 bg-blue-50 px-1.5 py-0.5 rounded border border-blue-100">{vip.job}</span>
                                                        </div>
                                                        <div className="flex flex-wrap gap-1">
                                                            {Object.keys(VENUE_CONFIG).map(v => {
                                                                const isSelected = currentAssigned === v;
                                                                return (
                                                                    <button key={v} type="button" onClick={(e) => handleBadgeClick(e, vip.name, v)} className={`px-2 py-0.5 text-[9.5px] font-bold rounded transition-all border ${isSelected ? 'bg-blue-600 text-white border-blue-600' : 'bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200'}`}>
                                                                        {v.replace(', Naga Camarines Sur', '').replace('Zillion Builders, ', '').replace('Njoy\'S Tourist And Learners\' Lounge', 'NJoy')}
                                                                    </button>
                                                                );
                                                            })}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}

                                <div className="pt-3 border-t border-slate-100 flex justify-end">
                                    <button type="button" onClick={handleProcessClick} className="px-6 py-2 rounded text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 shadow-sm transition-colors">
                                        Generate Balanced Schedule
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            const DashboardView = () => {
                if (!activeVenue || !scheduleData[activeVenue]) return null;
                const currentVenueData = scheduleData[activeVenue];
                const attendees = currentVenueData[activeDay] || [];
                const seatKey = `${activeVenue}_${activeDay}`;

                useEffect(() => {
                    if (currentVenueData.isOneDay && activeDay === 'Day2') setActiveDay('Day1');
                }, [activeVenue, currentVenueData]);

                const { displayGrid, displayRows, displayCols } = useMemo(() => {
                    let layout = customSeatings[seatKey];
                    if (!layout) {
                        const defaultCols = 5;
                        const defaultRows = Math.max(1, Math.ceil(attendees.length / defaultCols));
                        const newGrid = Array(defaultRows * defaultCols).fill(null);
                        const sortedAttendees = [...attendees].sort((a,b) => getJobPriority(a.job) - getJobPriority(b.job));
                        sortedAttendees.forEach((a, i) => newGrid[i] = a);
                        return { displayGrid: newGrid, displayRows: defaultRows, displayCols: defaultCols };
                    }
                    
                    let { grid, rows, cols } = layout;
                    const gridIdentifiers = grid.filter(Boolean).map(getPaxId);
                    const missing = attendees.filter(a => !gridIdentifiers.includes(getPaxId(a)));
                    
                    if (missing.length === 0) return { displayGrid: grid, displayRows: rows, displayCols: cols };

                    let nextGrid = [...grid];
                    let nextRows = rows;
                    
                    const sortedMissing = missing.sort((a,b) => getJobPriority(a.job) - getJobPriority(b.job));
                    sortedMissing.forEach(p => {
                        let emptyIdx = nextGrid.indexOf(null);
                        if (emptyIdx === -1) {
                            nextRows++;
                            nextGrid = nextGrid.concat(Array(cols).fill(null));
                            emptyIdx = nextGrid.indexOf(null);
                        }
                        nextGrid[emptyIdx] = p;
                    });
                    return { displayGrid: nextGrid, displayRows: nextRows, displayCols: cols };
                }, [customSeatings, seatKey, attendees]);

                const [selectedSeat, setSelectedSeat] = useState(null);

                const updateLayout = (newGrid, newRows, newCols) => {
                    setCustomSeatings(prev => ({ ...prev, [seatKey]: { grid: newGrid, rows: newRows, cols: newCols } }));
                };

                const groupedBySup = useMemo(() => {
                    const groups = {};
                    attendees.forEach(p => {
                        if (!groups[p.supervisor]) groups[p.supervisor] = [];
                        groups[p.supervisor].push(p);
                    });
                    return groups;
                }, [attendees]);

                const handleRowColChange = (type, val) => {
                    const num = Number(val) || 1;
                    let newRows = type === 'rows' ? num : displayRows;
                    let newCols = type === 'cols' ? num : displayCols;
                    
                    let newGrid = Array(newRows * newCols).fill(null);
                    displayGrid.forEach((p, i) => { if (p && i < newGrid.length) newGrid[i] = p; });
                    
                    const lost = displayGrid.slice(newGrid.length).filter(p => p !== null);
                    lost.forEach(p => {
                        const emptyIdx = newGrid.indexOf(null);
                        if (emptyIdx !== -1) newGrid[emptyIdx] = p;
                    });
                    updateLayout(newGrid, newRows, newCols);
                    setSelectedSeat(null);
                };

                const handleSeatClick = (index) => {
                    if (selectedSeat === null) {
                        if (displayGrid[index]) setSelectedSeat(index); 
                    } else {
                        if (selectedSeat === index) {
                            setSelectedSeat(null);
                        } else {
                            const nextGrid = [...displayGrid];
                            const temp = nextGrid[index];
                            nextGrid[index] = nextGrid[selectedSeat];
                            nextGrid[selectedSeat] = temp;
                            updateLayout(nextGrid, displayRows, displayCols);
                            setSelectedSeat(null); 
                        }
                    }
                };

                const activeDateStr = mappings.venueDates?.[activeVenue]?.[activeDay] || 'Date unset';

                return (
                    <div className="w-full px-2 mx-auto mt-4 space-y-4 pb-12 fade-in">
                        {/* Venue Navigation Bar */}
                        <div className="bg-white p-1.5 rounded-xl shadow-sm border border-slate-200 flex flex-wrap gap-1.5">
                            {sortedVenues.map(v => {
                                const isActive = activeVenue === v;
                                const totalCount = scheduleData[v].Day1.length + scheduleData[v].Day2.length;
                                return (
                                    <button key={v} type="button" onClick={() => { setActiveVenue(v); setSelectedSeat(null); }}
                                        className={`flex-1 flex-col text-left p-2 rounded-lg transition-all min-w-[150px] ${isActive ? 'bg-blue-50 border-blue-200 border shadow-sm' : 'border border-transparent text-slate-600 hover:bg-slate-50'}`}>
                                        <div className="flex justify-between items-center">
                                            <IconMapPin />
                                            <span className={`px-1.5 py-0.5 rounded text-[10px] font-bold ${isActive ? 'bg-blue-200 text-blue-800' : 'bg-slate-200 text-slate-600'}`}>{totalCount} Total</span>
                                        </div>
                                        <span className={`mt-1 text-[11px] font-semibold truncate block w-full ${isActive ? 'text-blue-900' : ''}`} title={v}>{v}</span>
                                    </button>
                                );
                            })}
                        </div>

                        {/* Schedule Header & Sub-toolbar */}
                        <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                            <div className="bg-slate-50 border-b border-slate-200 px-4 py-2.5 flex flex-wrap justify-between items-center gap-3">
                                <div className="flex items-center gap-2">
                                    <div className="flex space-x-1.5 bg-slate-200/60 p-1 rounded-md">
                                        <button type="button" onClick={() => {setActiveDay('Day1'); setSelectedSeat(null);}} className={`px-4 py-1.5 rounded text-xs font-semibold ${activeDay === 'Day1' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>
                                            Day 1 ({currentVenueData.Day1.length})
                                        </button>
                                        {!currentVenueData.isOneDay && (
                                            <button type="button" onClick={() => {setActiveDay('Day2'); setSelectedSeat(null);}} className={`px-4 py-1.5 rounded text-xs font-semibold ${activeDay === 'Day2' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>
                                                Day 2 ({currentVenueData.Day2.length})
                                            </button>
                                        )}
                                    </div>
                                    <span className="text-[11px] text-slate-500 font-bold bg-white px-2 py-1 rounded border border-slate-200 flex items-center">
                                        <IconCalendar /> {activeDateStr}
                                    </span>
                                </div>
                                
                                <div className="flex items-center gap-2 ml-auto">
                                    {!currentVenueData.isOneDay && (
                                        <button type="button" onClick={() => setShowSwapModal(true)} className="h-8 px-3 py-1 bg-white hover:bg-slate-50 text-slate-700 text-xs font-bold rounded border border-slate-300 shadow-2xs flex items-center">
                                            <IconSwap /> Reschedule / Swap
                                        </button>
                                    )}
                                    <button type="button" onClick={() => setShowDateModal(true)} className="h-8 px-3 py-1 bg-white hover:bg-slate-50 text-slate-700 text-xs font-bold rounded border border-slate-300 shadow-2xs flex items-center">
                                        <IconCalendar /> Set Dates
                                    </button>
                                    <div className="flex bg-slate-200/60 p-1 rounded-md">
                                        <button type="button" onClick={() => {setViewMode('list'); setSelectedSeat(null);}} className={`flex items-center px-3 py-1 rounded text-[11px] font-bold ${viewMode === 'list' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500'}`}><IconList /> List</button>
                                        <button type="button" onClick={() => setViewMode('seating')} className={`flex items-center px-3 py-1 rounded text-[11px] font-bold ${viewMode === 'seating' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500'}`}><IconGrid /> Seating</button>
                                    </div>
                                </div>
                            </div>

                            {/* View Content */}
                            <div className="p-4 bg-white min-h-[300px]">
                                {attendees.length === 0 ? (
                                    <div className="flex flex-col items-center justify-center h-48 text-slate-400"><IconAlert /><p className="mt-2 text-xs font-medium">No assigned personnel.</p></div>
                                ) : viewMode === 'list' ? (
                                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-5 gap-3">
                                        {Object.keys(groupedBySup).sort().map(sup => {
                                            const sortedList = [...groupedBySup[sup]].sort((a,b) => getJobPriority(a.job) - getJobPriority(b.job) || a.name.localeCompare(b.name));
                                            return (
                                                <div key={sup} className="bg-slate-50 rounded-lg p-3 border border-slate-100 flex flex-col h-full">
                                                    <h4 className="text-[10px] font-bold text-slate-500 uppercase border-b border-slate-200 pb-1.5 mb-2 truncate" title={sup}>{sup}</h4>
                                                    <ul className="space-y-1.5 flex-grow">
                                                        {sortedList.map((p, i) => {
                                                            const paxId = getPaxId(p);
                                                            const att = attendanceData[paxId] || { status: 'Present', violation: false, remarks: '' };
                                                            return (
                                                                <li key={p.name + i} className={`flex flex-col text-[11px] font-semibold text-slate-700 p-2 rounded shadow-2xs border ${p.isManual ? 'is-manual-list' : 'bg-white border-slate-200'}`}>
                                                                    <div className="flex items-center justify-between gap-1">
                                                                        <div className="flex items-center truncate">
                                                                            <IconUser /> 
                                                                            <span className="truncate">{p.name}</span>
                                                                        </div>
                                                                        <div className="flex items-center gap-1 flex-shrink-0">
                                                                            <button type="button" onClick={() => setEditingSeatPax(p)} className="text-slate-400 hover:text-blue-600 p-0.5">
                                                                                <IconEdit />
                                                                            </button>
                                                                            <button type="button" onClick={() => setPaxToRemove(p)} className="text-slate-400 hover:text-red-600 p-0.5">
                                                                                <IconTrash className="w-3 h-3" />
                                                                            </button>
                                                                        </div>
                                                                    </div>
                                                                    <div className="flex items-center justify-between text-[9px] text-slate-400 mt-1">
                                                                        <span>{p.mall || p.location}</span>
                                                                        <div className="flex items-center gap-1">
                                                                            {p.job.includes('OPERATOR') && <span className="bg-purple-100 text-purple-700 font-bold px-1 rounded">OP.PROMO</span>}
                                                                            {p.job.includes('CLUSTER LEAD') && <span className="bg-blue-100 text-blue-700 font-bold px-1 rounded">C.LEAD</span>}
                                                                            {p.job.includes('MALL LEADER') && <span className="bg-blue-100 text-blue-700 font-bold px-1 rounded">M.LEAD</span>}
                                                                            {p.job.includes('MERCHANDISER') && <span className="bg-blue-100 text-blue-700 font-bold px-1 rounded">MERCH</span>}
                                                                            {att.status !== 'Present' && (
                                                                                <span className={`px-1 rounded font-bold ${att.status==='Late'?'bg-orange-100 text-orange-700':'bg-red-100 text-red-700'}`}>{att.status}</span>
                                                                            )}
                                                                            {att.violation && <span>⚠️</span>}
                                                                        </div>
                                                                    </div>
                                                                </li>
                                                            );
                                                        })}
                                                    </ul>
                                                </div>
                                            );
                                        })}
                                    </div>
                                ) : (
                                    <div className="flex flex-col items-center">
                                        <div className="w-full mb-4 flex flex-wrap justify-between items-center bg-slate-50 p-2.5 rounded-lg border border-slate-200 gap-4">
                                            <div className="flex items-center gap-4">
                                                <div className="flex items-center gap-2">
                                                    <label className="text-[11px] font-bold text-slate-600">Rows</label>
                                                    <input type="number" min="1" max="50" value={displayRows} onChange={e => handleRowColChange('rows', e.target.value)} className="w-16 border rounded p-1 text-xs text-center font-semibold outline-none focus:border-blue-400" />
                                                </div>
                                                <div className="flex items-center gap-2">
                                                    <label className="text-[11px] font-bold text-slate-600">Cols</label>
                                                    <input type="number" min="1" max="50" value={displayCols} onChange={e => handleRowColChange('cols', e.target.value)} className="w-16 border rounded p-1 text-xs text-center font-semibold outline-none focus:border-blue-400" />
                                                </div>
                                            </div>
                                            <div className="flex gap-2">
                                                <button type="button" onClick={() => {
                                                    preserveScroll(() => {
                                                        const activePeople = displayGrid.filter(a => a !== null);
                                                        // Keep Non-Promoters in the front seats!
                                                        const vips = activePeople.filter(p => getJobPriority(p.job) < 5);
                                                        const promoters = activePeople.filter(p => getJobPriority(p.job) >= 5);
                                                        
                                                        vips.sort((a,b) => getJobPriority(a.job) - getJobPriority(b.job) || a.name.localeCompare(b.name));
                                                        const shuffledPromoters = shuffleArray(promoters);
                                                        
                                                        const combined = [...vips, ...shuffledPromoters];
                                                        const newGrid = Array(displayRows * displayCols).fill(null);
                                                        combined.forEach((a, i) => {
                                                            if (i < newGrid.length) newGrid[i] = a;
                                                        });
                                                        updateLayout(newGrid, displayRows, displayCols);
                                                        setSelectedSeat(null);
                                                    });
                                                }} className="px-3 py-1.5 rounded text-[11px] font-bold bg-indigo-50 text-indigo-700 border border-indigo-100 shadow-sm hover:bg-indigo-100 flex items-center">
                                                    <IconShuffle /> Shuffle Layout
                                                </button>
                                                
                                                <button type="button" onClick={() => {
                                                    setSelectedSeat(null);
                                                    setTimeout(async () => {
                                                        const el = document.getElementById('seating-capture-area');
                                                        if (el) {
                                                            const canvas = await window.html2canvas(el, { scale: 2, backgroundColor: '#f8fafc' });
                                                            const link = document.createElement('a');
                                                            link.download = `Seating_${activeVenue}_${activeDay}.png`;
                                                            link.href = canvas.toDataURL();
                                                            link.click();
                                                        }
                                                    }, 100);
                                                }} className="px-3 py-1.5 rounded text-[11px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-100 shadow-sm hover:bg-emerald-100 flex items-center">
                                                    <IconCamera /> Save Image
                                                </button>
                                            </div>
                                        </div>

                                        {/* Seating Grid Canvas */}
                                        <div className="w-full overflow-auto custom-scrollbar p-4 bg-slate-100/50 rounded-xl border border-slate-200">
                                            <div id="seating-capture-area" className="p-4 bg-slate-100/50 w-fit mx-auto rounded-lg relative">
                                                <div className="text-center mb-5">
                                                    <h3 className="text-sm font-bold text-slate-700">{activeVenue}</h3>
                                                    <p className="text-[10px] text-slate-500 font-medium uppercase tracking-widest">{activeDay} Seating • {activeDateStr}</p>
                                                </div>
                                                <div className="grid gap-2.5 mx-auto" style={{ gridTemplateColumns: `repeat(${displayCols}, minmax(115px, 1fr))`, gridTemplateRows: `repeat(${displayRows}, minmax(80px, 1fr))` }}>
                                                    {displayGrid.map((attendee, i) => {
                                                        const isSelected = selectedSeat === i;
                                                        let attData = null;
                                                        let boxClasses = "relative flex flex-col items-center justify-center p-2 rounded-lg text-center transition-all cursor-pointer select-none border group min-h-[70px] ";
                                                        
                                                        if (attendee) {
                                                            attData = attendanceData[getPaxId(attendee)] || { status: 'Present', violation: false };
                                                            
                                                            if (isSelected) boxClasses += "bg-amber-50 border-amber-400 border-b-4 ring-2 ring-amber-400 shadow-md transform -translate-y-0.5";
                                                            else if (attData.status === 'Absent') boxClasses += "seat-absent border-b-4 shadow-sm";
                                                            else if (attData.status === 'Late') boxClasses += "seat-late border-b-4 shadow-sm";
                                                            else if (attendee.isManual) boxClasses += "is-manual-seat border-b-4 shadow-sm";
                                                            else boxClasses += "bg-white border-slate-200 border-b-4 border-b-blue-500 shadow-sm";
                                                        } else {
                                                            if (selectedSeat !== null) boxClasses += "bg-emerald-50/50 border-2 border-dashed border-emerald-300";
                                                            else boxClasses += "bg-slate-200/40 border-2 border-dashed border-slate-300";
                                                        }

                                                        return (
                                                            <div key={`seat-${i}`} onClick={() => handleSeatClick(i)} className={boxClasses}>
                                                                {attendee ? (
                                                                    <>
                                                                        <div className="absolute top-1 right-1 flex gap-1 z-20">
                                                                            {attData.violation && <span className="text-[10px]" title="One Look Violation">⚠️</span>}
                                                                            <button type="button" onClick={(e) => { e.stopPropagation(); setEditingSeatPax(attendee); }} className="opacity-0 group-hover:opacity-100 text-slate-400 hover:text-blue-600 bg-white/80 rounded shadow-sm p-1 transition-opacity">
                                                                                <IconEdit />
                                                                            </button>
                                                                        </div>
                                                                        
                                                                        {attendee.job.includes('OPERATOR') ? (
                                                                            <span className="absolute top-1 left-1 text-[7px] font-bold text-purple-700 bg-purple-100 px-1 py-0.5 rounded shadow-2xs tracking-tighter truncate max-w-[50px] z-20">OP.PROMO</span>
                                                                        ) : attendee.job !== 'PROMOTER' && !attendee.job.includes('PROMO') ? (
                                                                            <span className="absolute top-1 left-1 text-[7px] font-bold text-blue-700 bg-blue-100 px-1 py-0.5 rounded shadow-2xs tracking-tighter truncate max-w-[50px] z-20">
                                                                                {attendee.job.replace('CLUSTER LEAD', 'C.LEAD').replace('MALL LEADER', 'M.LEAD').replace('MERCHANDISER', 'MERCH')}
                                                                            </span>
                                                                        ) : null}
                                                                        
                                                                        <span className="text-[9px] font-bold mb-0.5 opacity-60 mt-1">Seat {i+1}</span>
                                                                        <span className="text-[11px] font-bold leading-tight z-10 px-1">{attendee.name}</span>
                                                                        <span className="text-[8px] mt-0.5 truncate w-full z-10 px-1 opacity-70" title={attendee.supervisor}>{attendee.mall || attendee.supervisor}</span>
                                                                        
                                                                        {attData.remarks && (
                                                                            <span className="absolute bottom-1 w-[90%] text-[7px] bg-slate-100 text-slate-500 truncate px-1 rounded mx-auto left-0 right-0 border border-slate-200" title={attData.remarks}>{attData.remarks}</span>
                                                                        )}
                                                                    </>
                                                                ) : (
                                                                    <span className={`text-[10px] font-bold ${selectedSeat !== null ? 'text-emerald-500' : 'text-slate-400'}`}>
                                                                        {selectedSeat !== null ? 'Swap/Move' : 'Empty'}
                                                                    </span>
                                                                )}
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Floating Toast Notification */}
                    {toastMessage && (
                        <div className="fixed bottom-5 right-5 z-50 bg-slate-800 text-white text-xs font-bold px-4 py-2.5 rounded-lg shadow-xl fade-in flex items-center gap-2">
                            <span>{toastMessage}</span>
                        </div>
                    )}

                    <header className="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-20">
                        <div className="w-full px-2 md:px-4 h-[60px] flex items-center justify-between">
                            <h1 className="text-sm font-bold text-slate-800 tracking-tight hidden sm:block mr-4 flex-shrink-0">Promoter Dashboard</h1>
                            
                            <div className="flex items-center gap-2 overflow-x-auto custom-scrollbar h-full py-2 w-full sm:w-auto">
                                {/* Online Cloud Sync Status Badge */}
                                <button 
                                    type="button" 
                                    onClick={() => setShowCloudModal(true)}
                                    title="Click to view shared workspace details or switch rooms"
                                    className={`h-10 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center border transition-all shadow-xs cursor-pointer ${
                                        syncStatus === 'synced' ? 'bg-emerald-50 text-emerald-700 border-emerald-300 hover:bg-emerald-100' :
                                        syncStatus === 'saving' ? 'bg-amber-50 text-amber-700 border-amber-300 hover:bg-amber-100' :
                                        syncStatus === 'connecting' ? 'bg-blue-50 text-blue-700 border-blue-300 hover:bg-blue-100' :
                                        'bg-slate-100 text-slate-600 border-slate-300 hover:bg-slate-200'
                                    }`}
                                >
                                    <IconCloud className="w-3.5 h-3.5 mr-1.5" />
                                    <span className="hidden md:inline mr-1">
                                        {syncStatus === 'synced' ? 'Cloud Synced' : syncStatus === 'saving' ? 'Saving...' : syncStatus === 'connecting' ? 'Connecting...' : 'Cloud Setup'}
                                    </span>
                                    <span className={`w-2 h-2 rounded-full ${syncStatus === 'synced' ? 'bg-emerald-500' : syncStatus === 'saving' ? 'bg-amber-500 animate-spin' : syncStatus === 'connecting' ? 'bg-blue-500' : 'bg-slate-400'}`}></span>
                                </button>

                                {step === 'dashboard' && (
                                    <>
                                        {viewMode === 'list' && (
                                            <button type="button" onClick={() => processSchedule(true)} className={headerBtnBase}>
                                                <IconShuffle /> Shuffle Schedule
                                            </button>
                                        )}
                                        <button type="button" onClick={() => setShowAddModal(true)} className={headerBtnBase}>
                                            <IconUserPlus /> Add Pax
                                        </button>
                                        <div className="w-px h-6 bg-slate-200 mx-1 flex-shrink-0"></div>
                                        <button type="button" onClick={handleExportExcel} className={headerBtnBase}>
                                            <IconTable /> Export Excel
                                        </button>
                                        <button type="button" onClick={handleSaveWorkspace} className={headerBtnBase}>
                                            <IconSaveFile /> Save Workspace
                                        </button>
                                    </>
                                )}
                                
                                <label className={headerBtnBase + " cursor-pointer m-0"}>
                                    <IconUpload /> Load Workspace
                                    <input type="file" ref={fileInputRef} className="hidden" accept=".xlsx, .xls, .json" onChange={(e) => {
                                        if (e.target.files[0].name.endsWith('.json')) handleLoadWorkspace(e);
                                        else handleFileUpload(e);
                                        e.target.value = null; 
                                    }} />
                                </label>
                            </div>
                        </div>
                    </header>

                    <main className="w-full flex-grow">
                        {step === 'upload' && (
                            <div className="max-w-md mx-auto mt-20 fade-in px-4">
                                <div className="bg-white p-8 rounded-xl shadow-sm border border-slate-200 text-center">
                                    <div className="w-12 h-12 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-3">
                                        <IconUpload />
                                    </div>
                                    <h2 className="text-lg font-bold text-slate-800 mb-1">Upload Field Force Excel</h2>
                                    <p className="text-slate-500 mb-6 text-xs">Target file: <strong>FF Sched OD October.xlsx</strong></p>
                                    <button type="button" onClick={() => fileInputRef.current.click()} className="w-full border-2 border-dashed border-blue-300 hover:border-blue-500 rounded-lg px-4 py-8 bg-blue-50/40 transition-colors cursor-pointer block">
                                        <span className="text-blue-600 font-bold text-sm">Click to choose Excel or Workspace file</span>
                                    </button>
                                    {error && <div className="mt-4 text-red-600 text-xs font-bold bg-red-50 p-2 rounded flex items-center justify-center"><IconAlert /> {error}</div>}
                                </div>
                            </div>
                        )}

                        {step === 'mapping' && <MappingView />}
                        {step === 'dashboard' && scheduleData && <DashboardView />}
                    </main>
                    
                    <AddParticipantModal />
                    <RescheduleSwapModal />
                    <VenueDateSetupModal />
                    <AttendanceModal />
                    <RemoveConfirmModal />

                    {/* Cloud Synchronization and Room Sharing Modal */}
                    {showCloudModal && (
                        <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-50 p-4 fade-in backdrop-blur-sm">
                            <div className="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden">
                                <div className="px-5 py-3.5 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                                    <h3 className="font-bold text-slate-800 text-sm flex items-center gap-1.5">
                                        <IconCloud className="text-blue-600 w-4 h-4" /> Live Online Sync & Collaboration
                                    </h3>
                                    <button type="button" onClick={() => setShowCloudModal(false)} className="text-slate-400 hover:text-slate-600 transition-colors">
                                        <IconClose />
                                    </button>
                                </div>
                                <div className="p-5 space-y-4">
                                    <div className="bg-slate-50 p-3 rounded-lg border border-slate-200 space-y-2">
                                        <div className="flex items-center justify-between text-xs">
                                            <span className="text-slate-500 font-medium">Sync Status:</span>
                                            <span className="font-bold flex items-center gap-1.5">
                                                {syncStatus === 'synced' && <><span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span> <span className="text-emerald-700">Online (Connected)</span></>}
                                                {syncStatus === 'saving' && <><span className="w-2.5 h-2.5 rounded-full bg-amber-500 animate-spin"></span> <span className="text-amber-700">Syncing Changes...</span></>}
                                                {syncStatus === 'connecting' && <><span className="w-2.5 h-2.5 rounded-full bg-blue-500 animate-ping"></span> <span className="text-blue-700">Connecting...</span></>}
                                                {syncStatus === 'offline' && <><span className="w-2.5 h-2.5 rounded-full bg-slate-400"></span> <span className="text-slate-600">Local Only (Offline)</span></>}
                                                {syncStatus === 'error' && <><span className="w-2.5 h-2.5 rounded-full bg-red-500"></span> <span className="text-red-700">Connection Error</span></>}
                                            </span>
                                        </div>
                                        {lastSyncedTime && (
                                            <div className="flex items-center justify-between text-[11px] text-slate-500">
                                                <span>Last Synced:</span>
                                                <span className="font-semibold text-slate-700">{lastSyncedTime}</span>
                                            </div>
                                        )}
                                        {cloudUserId && (
                                            <div className="flex flex-col text-[10px] text-slate-500 pt-1 border-t border-slate-200">
                                                <span className="font-medium">User Device ID:</span>
                                                <span className="font-mono text-slate-600 truncate">{cloudUserId}</span>
                                            </div>
                                        )}
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">Shared Workspace Room ID</label>
                                        <div className="flex gap-2">
                                            <input 
                                                type="text" 
                                                value={cloudRoomId} 
                                                onChange={e => setCloudRoomId(e.target.value.toLowerCase().replace(/[^a-z0-9_-]/g, ''))}
                                                className="flex-grow border border-slate-300 rounded px-2.5 py-1.5 text-xs font-mono bg-white outline-none focus:ring-1 focus:ring-blue-500" 
                                                placeholder="e.g. south-luzon-training"
                                            />
                                            <button 
                                                type="button" 
                                                onClick={() => {
                                                    initCloudStorage(cloudRoomId);
                                                    showToast(`Connected to room: ${cloudRoomId}`);
                                                }}
                                                className="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded text-xs font-bold transition-colors shadow-xs"
                                            >
                                                Switch
                                            </button>
                                        </div>
                                        <p className="text-[10px] text-slate-400 mt-1">Colleagues using this same Room ID will see and edit the exact same live schedule.</p>
                                    </div>

                                    <div className="flex items-center justify-between p-2.5 bg-slate-50 border border-slate-200 rounded-lg">
                                        <div>
                                            <span className="text-xs font-bold text-slate-700 block">Automatic Cloud Sync</span>
                                            <span className="text-[10px] text-slate-500">Syncs seating, attendance, and swaps in real time</span>
                                        </div>
                                        <input 
                                            type="checkbox" 
                                            checked={autoSyncEnabled} 
                                            onChange={e => setAutoSyncEnabled(e.target.checked)} 
                                            className="w-4 h-4 text-blue-600 rounded cursor-pointer"
                                        />
                                    </div>

                                    <div className="pt-2 border-t border-slate-100 flex items-center justify-between gap-2">
                                        <button 
                                            type="button" 
                                            onClick={() => {
                                                const shareUrl = `${window.location.origin}${window.location.pathname}?workspace=${cloudRoomId}`;
                                                const dummy = document.createElement('input');
                                                document.body.appendChild(dummy);
                                                dummy.value = shareUrl;
                                                dummy.select();
                                                document.execCommand('copy');
                                                document.body.removeChild(dummy);
                                                showToast("Shareable link copied to clipboard!");
                                            }}
                                            className="px-3 py-1.5 text-xs font-bold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg border border-slate-200 transition-colors flex items-center gap-1.5"
                                        >
                                            <IconShare /> Copy Link
                                        </button>

                                        <button 
                                            type="button" 
                                            onClick={() => {
                                                pushToCloud();
                                                setShowCloudModal(false);
                                            }}
                                            className="px-4 py-1.5 text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-sm transition-colors flex items-center gap-1.5"
                                        >
                                            <IconCloudSync /> Sync Now
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // Render application wrapped in Error Boundary
        const App = () => (
            <ErrorBoundary>
                <MainDashboard />
            </ErrorBoundary>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
